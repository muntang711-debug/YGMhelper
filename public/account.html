<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>계정 관리 | YGMhelper</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div id="app">
    <p class="beta-banner">베타 서비스 · 정식 출시 시 베타 계정과 데이터가 초기화됩니다.</p>
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">YGMhelper</a>

      <div class="topbar-actions">
        <a id="member-link" class="member-link" href="/login.html" hidden>로그인</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
      </div>
    </header>
    <main class="page-shell auth-shell">
      <div class="auth-content">
<h1>계정 관리</h1><p id="account-user"></p><button id="logout" type="button" class="auth-submit">로그아웃</button><section class="delete-section"><h2>회원 탈퇴</h2><p>계정과 로그인 세션을 삭제합니다. 탈퇴 후 복구할 수 없습니다.</p><form data-action="delete" method="post" action="/api/auth/delete"><label class="auth-field"><input name="password" id="password" type="password" autocomplete="current-password" maxlength="128" placeholder=" " required><span>현재 비밀번호</span></label><label class="check-label"><input type="checkbox" name="deleteConfirm" required><span class="check-mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10 3.5 3.5 7.5-7.5"/></svg></span><span>계정 삭제에 동의합니다.</span></label><p id="form-status" role="status"></p><button class="auth-submit danger" type="submit" disabled>계정 삭제</button></form></section>
      </div>
    </main>
  </div>
  <script src="/js/site-theme.js" type="module"></script>
  <script src="/js/auth.js" type="module"></script>
  <script src="/js/membership.js" type="module"></script>
</body>
</html>
