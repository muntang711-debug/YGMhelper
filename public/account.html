<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 관리 | YGMhelper</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body><header class="auth-topbar"><a href="/">YGMhelper</a></header><main class="auth-shell"><h1>계정 관리</h1><p id="account-user"></p><button id="logout" class="auth-submit">로그아웃</button><section class="delete-section"><h2>회원 탈퇴</h2><p>아이디, 비밀번호 해시, 로그인 세션을 삭제합니다. 탈퇴 후 복구할 수 없습니다.</p><form data-action="delete"><label>현재 비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="15" maxlength="128"></label><label class="check-label"><input type="checkbox" name="deleteConfirm" required>계정 삭제에 동의합니다.</label><p id="form-status" role="status"></p><button class="auth-submit danger" type="submit">계정 삭제</button></form></section></main><script src="/js/auth.js" type="module"></script></body></html>
