<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="급식표와 시간표를 빠르게 확인할 수 있는 YGMhelper">
  <title>YGMhelper</title>
  <link rel="stylesheet" href="/css/style.css?v=20261104-4">
</head>
<body data-mobile-view="meal">
  <div id="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">YGMhelper</a>

      <div class="topbar-actions">
      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
      </div>
    </header>

    <main class="page-shell">
      <div class="mobile-switch" role="tablist" aria-label="화면 전환">
        <span class="switch-indicator" aria-hidden="true"></span>
        <button id="tab-meal" class="nav-item is-active" data-view="meal" role="tab" aria-controls="view-meal" aria-selected="true" type="button">급식</button>
        <button id="tab-timetable" class="nav-item" data-view="timetable" role="tab" aria-controls="view-timetable" aria-selected="false" tabindex="-1" type="button">시간표</button>
      </div>

      <div class="global-toolbar">

        <div class="date-control">
          <button class="date-trigger" type="button" aria-haspopup="dialog" aria-controls="date-picker" aria-expanded="false">
            <span></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
        </div>
      </div>

      <div class="content-grid">
        <section id="view-meal" class="view" role="tabpanel" aria-labelledby="tab-meal">
          <div class="section-heading">
            <div>
              <p class="section-kicker">MEAL</p>
              <h2>급식</h2>
            </div>
            <button id="refresh-data" class="icon-button data-refresh" data-refresh="meal" type="button" aria-label="급식 새로고침" title="새로고침"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg></button>
          </div>

          <div id="meal-status" class="status-message" role="status" aria-atomic="true" hidden></div>
          <div id="meal-card" class="data-card meal-card"></div>
        </section>

        <section id="view-timetable" class="view" role="tabpanel" aria-labelledby="tab-timetable">
          <div class="section-heading">
            <div>
              <p class="section-kicker">TIMETABLE</p>
              <h2>시간표</h2>
            </div>

            <div class="control-row">
              <div class="custom-select" data-select="grade">
                <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="select-value">1학년</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                </button>
                <div class="select-menu" role="listbox"></div>
              </div>

              <div class="custom-select" data-select="class">
                <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="select-value">1반</span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                </button>
                <div class="select-menu" role="listbox"></div>
              </div>
            </div>
            <button id="refresh-timetable" class="icon-button data-refresh" data-refresh="timetable" type="button" aria-label="시간표 새로고침" title="새로고침"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg></button>
          </div>

          <div id="timetable-status" class="status-message" role="status" aria-atomic="true" hidden></div>
          <section class="weekly-section" aria-label="시간표">
            <div id="weekly-timetable" class="weekly-scroll" role="region" aria-label="월요일부터 금요일까지 주간 시간표"></div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/app.js?v=20261104-4" type="module"></script>
</body>
</html>
