<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="시간표와 급식 정보를 한 곳에서 확인할 수 있는 YGMhelper">
  <meta name="theme-color" content="#5f50d7">
  <title>YGMhelper</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("ygmhelper.theme");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="YGMhelper home">YGMhelper</a>

      <nav class="main-nav" aria-label="Primary navigation">
        <a href="#meal" data-i18n="navMeal">급식표</a>
        <a href="#timetable" data-i18n="navTimetable">시간표</a>
      </nav>

      <div class="header-actions">
        <div class="language-switcher" aria-label="Language">
          <button type="button" class="language-button" data-language="ko">한국어</button>
          <button type="button" class="language-button" data-language="en">EN</button>
        </div>
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Theme" aria-pressed="false">
          <span aria-hidden="true">☾</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="page-toolbar" aria-label="Date navigation">
      <div class="page-title">
        <p class="page-kicker">YGMhelper</p>
        <h1 data-i18n="pageTitle">오늘</h1>
        <p id="hero-date-label" class="page-date"></p>
      </div>

      <div class="date-control">
        <button type="button" id="previous-day" class="date-arrow" aria-label="Previous day">‹</button>
        <label class="date-input">
          <input type="date" id="date-picker" aria-label="Selected date">
        </label>
        <button type="button" id="today-button" class="today-button" data-i18n="today">오늘</button>
        <button type="button" id="next-day" class="date-arrow" aria-label="Next day">›</button>
      </div>
    </section>

    <section class="content-grid">
      <section id="meal" class="panel">
        <header class="panel-header">
          <div>
            <span class="panel-number">01</span>
            <h2 data-i18n="mealTitle">급식표</h2>
          </div>
          <time id="meal-date-label" class="panel-date"></time>
        </header>

        <div id="meal-content" class="panel-body" aria-live="polite">
          <div class="loading-state" data-i18n="loading">불러오는 중...</div>
        </div>

        <footer class="panel-footer">
          <button type="button" id="allergy-button" class="link-button" data-i18n="allergyGuide">
            알레르기 번호 안내
            <span aria-hidden="true">→</span>
          </button>
        </footer>
      </section>

      <section id="timetable" class="panel">
        <header class="panel-header">
          <div>
            <span class="panel-number">02</span>
            <h2 data-i18n="timetableTitle">시간표</h2>
          </div>
          <time id="timetable-date-label" class="panel-date"></time>
        </header>

        <div class="selection-bar">
          <label class="select-field">
            <span data-i18n="grade">학년</span>
            <select id="grade-select" aria-label="Grade"></select>
          </label>
          <label class="select-field">
            <span data-i18n="class">반</span>
            <select id="class-select" aria-label="Class"></select>
          </label>
          <button type="button" id="refresh-button" class="refresh-button" aria-label="Refresh">
            <span aria-hidden="true">↻</span>
            <span data-i18n="refresh">새로고침</span>
          </button>
        </div>

        <div id="timetable-content" class="panel-body timetable-body" aria-live="polite">
          <div class="loading-state" data-i18n="loading">불러오는 중...</div>
        </div>
      </section>
    </section>
  </main>

  <div id="allergy-modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="allergy-modal-title">
      <header class="modal-header">
        <div>
          <span class="modal-kicker" data-i18n="allergyKicker">GUIDE</span>
          <h2 id="allergy-modal-title" data-i18n="allergyTitle">알레르기 안내</h2>
        </div>
        <button type="button" id="close-allergy-modal" class="modal-close" aria-label="Close">×</button>
      </header>
      <p class="modal-note" data-i18n="allergyNote">급식 메뉴 뒤의 숫자는 알레르기 식품 번호입니다.</p>
      <div id="allergy-list" class="allergy-list"></div>
    </section>
  </div>
</body>
</html>
