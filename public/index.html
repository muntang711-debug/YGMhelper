<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="급식표와 시간표를 빠르게 확인할 수 있는 YGMhelper">
  <title>YGMhelper</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">
        <span class="brand-mark">Y</span>
        <span class="brand-text">YGMhelper</span>
      </a>

      <nav class="top-nav" aria-label="주요 메뉴">
        <button class="nav-item is-active" data-view="meal" type="button">급식</button>
        <button class="nav-item" data-view="timetable" type="button">시간표</button>
      </nav>

      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
    </header>

    <main class="page-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">SCHOOL DAY</p>
          <h1>오늘 필요한 정보를<br><span>한눈에.</span></h1>
          <p class="hero-copy">날짜를 선택하고 급식과 시간표를 바로 확인하세요.</p>
        </div>
        <div class="hero-orb" aria-hidden="true"></div>
      </section>

      <section id="view-meal" class="view">
        <div class="section-heading">
          <div>
            <p class="section-kicker">MEAL</p>
            <h2>급식</h2>
          </div>
          <div class="date-control" data-date-control="meal"></div>
        </div>

        <div id="meal-status" class="status-message" hidden></div>
        <div id="meal-card" class="data-card meal-card">
          <div class="loading-state">
            <div class="loading-line wide"></div>
            <div class="loading-line"></div>
            <div class="loading-line"></div>
            <div class="loading-line short"></div>
          </div>
        </div>
      </section>

      <section id="view-timetable" class="view" hidden>
        <div class="section-heading section-heading-stack-mobile">
          <div>
            <p class="section-kicker">TIMETABLE</p>
            <h2>시간표</h2>
          </div>
          <div class="control-row">
            <div class="custom-select" data-select="grade">
              <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="select-value">1학년</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <div class="select-menu" role="listbox"></div>
            </div>
            <div class="custom-select" data-select="class">
              <button class="select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="select-value">1반</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <div class="select-menu" role="listbox"></div>
            </div>
            <div class="date-control" data-date-control="timetable"></div>
          </div>
        </div>

        <div id="timetable-status" class="status-message" hidden></div>
        <div id="timetable-card" class="data-card timetable-card"></div>
      </section>
    </main>

    <footer class="footer">
      <span>YGMhelper</span>
      <span>공공데이터 기반 정보 서비스</span>
    </footer>
  </div>

  <script src="/js/app.js" defer></script>
</body>
</html>
