<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="시간표와 급식 정보를 한 곳에서 확인할 수 있는 YGMhelper">
  <meta name="theme-color" content="#0078ff">
  <title>YGMhelper</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("ygmhelper.theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : (systemDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="top-app-bar">
      <div class="brand-menu">
        <button type="button" id="brand-menu-trigger" class="brand-trigger" aria-expanded="false" aria-haspopup="menu">
          <span class="brand">YGMhelper</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div id="brand-menu" class="brand-menu-panel" hidden>
          <nav class="brand-nav" aria-label="Page navigation">
            <a href="#meal" data-i18n="navMeal">급식표</a>
            <a href="#timetable" data-i18n="navTimetable">시간표</a>
          </nav>
          <div class="brand-menu-divider"></div>
          <div class="language-switcher" aria-label="Language">
            <button type="button" class="language-button" data-language="ko">한국어</button>
            <button type="button" class="language-button" data-language="en">EN</button>
          </div>
        </div>
      </div>

      <div class="top-actions">
        <button type="button" id="theme-toggle" class="icon-button" aria-label="Theme" aria-pressed="false">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2.5V5M12 19V21.5M4.58 4.58L6.35 6.35M17.65 17.65l1.77 1.77M2.5 12H5M19 12h2.5M4.58 19.42l1.77-1.77M17.65 6.35l1.77-1.77" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 15.2A8.2 8.2 0 0 1 8.8 4 8.7 8.7 0 1 0 20 15.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="page-top">
      <div class="title-block">
        <button type="button" id="date-trigger" class="current-date" aria-haspopup="dialog" aria-expanded="false"></button>
        <h1 data-i18n="pageTitle">이날의 학교생활</h1>
      </div>

      <div id="date-popover" class="date-popover" hidden>
        <div class="date-popover-header">
          <button type="button" id="calendar-prev" class="calendar-nav" aria-label="Previous month">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <strong id="calendar-title"></strong>
          <button type="button" id="calendar-next" class="calendar-nav" aria-label="Next month">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="date-adjuster">
          <button type="button" id="previous-day" class="date-adjust-button" aria-label="Previous day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" id="today-button" class="date-today-button" data-i18n="today">오늘</button>
          <button type="button" id="next-day" class="date-adjust-button" aria-label="Next day">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="calendar-weekdays" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
    </section>

    <section class="content-grid">
      <section id="meal" class="card">
        <header class="card-header">
          <h2 data-i18n="mealTitle">급식표</h2>
        </header>

        <div id="meal-content" class="card-content" aria-live="polite">
          <div class="loading-state" data-i18n="loading">불러오는 중...</div>
        </div>

        <footer class="card-footer">
          <button type="button" id="allergy-button" class="text-button" data-i18n="allergyGuide">
            알레르기 번호 안내
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </footer>
      </section>

      <section id="timetable" class="card">
        <header class="card-header timetable-header">
          <div class="timetable-heading">
            <h2 data-i18n="timetableTitle">시간표</h2>

            <div class="class-controls">
              <div class="custom-select">
                <button type="button" id="grade-trigger" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span id="grade-value"></span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div id="grade-menu" class="custom-select-menu" role="listbox" hidden></div>
              </div>

              <div class="custom-select">
                <button type="button" id="class-trigger" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span id="class-value"></span>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div id="class-menu" class="custom-select-menu class-menu" role="listbox" hidden></div>
              </div>

              <button type="button" id="refresh-button" class="icon-button refresh-button" data-i18n-title="refresh" aria-label="새로고침" title="새로고침">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8.5A7.5 7.5 0 1 0 19.5 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </header>

        <div id="timetable-content" class="card-content timetable-content" aria-live="polite">
          <div class="loading-state" data-i18n="loading">불러오는 중...</div>
        </div>
      </section>
    </section>
  </main>

  <div id="allergy-modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="allergy-modal-title">
      <header class="modal-header">
        <h2 id="allergy-modal-title" data-i18n="allergyTitle">알레르기 안내</h2>
        <button type="button" id="close-allergy-modal" class="icon-button modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="allergy-list" class="allergy-list"></div>
    </section>
  </div>
</body>
</html>
