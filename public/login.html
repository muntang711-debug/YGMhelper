<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>로그인 | YGMhelper</title>
  <link rel="stylesheet" href="/css/style.css?v=20261109-layout">
  <link rel="stylesheet" href="/css/auth.css?v=20261109-layout">
</head>
<body class="auth-page">
  <div id="app">
    <p class="beta-banner">베타 서비스 · 정식 출시 시 베타 계정과 데이터가 초기화됩니다.</p>
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">YGMhelper</a>

      <div class="topbar-actions">
        <a id="member-link" class="member-link" href="/login.html" hidden>로그인</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
      </div>
    </header>
    <main class="page-shell auth-shell">
      <div class="auth-content">
<h1>로그인</h1>
<form id="login-form" name="login-form" novalidate data-action="login" method="post" action="/api/auth/login">
<div class="auth-field"><input name="username" id="username" type="text" autocapitalize="none" spellcheck="false" autocomplete="username" pattern="[A-Za-z0-9_]{4,24}" minlength="4" maxlength="24" placeholder=" " required><label for="username">아이디</label><fieldset aria-hidden="true"><legend><span>아이디</span></legend></fieldset></div>
<div class="auth-field has-password-toggle"><input name="password" id="password" type="password" autocomplete="current-password" minlength="1" maxlength="128" placeholder=" " required><label for="password">비밀번호</label><fieldset aria-hidden="true"><legend><span>비밀번호</span></legend></fieldset><button class="password-toggle" type="button" aria-label="비밀번호 표시" aria-controls="password" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 5.6A11 11 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.1 3.7M6.2 6.2A19 19 0 0 0 2.5 12s3.5 6.5 9.5 6.5a12 12 0 0 0 4-.7M10 10a3 3 0 0 0 4 4"/></svg></button></div>
<label class="check-label remember-choice"><input type="checkbox" name="remember" id="remember"><span class="check-mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="m4.5 10 3.5 3.5 7.5-7.5"/></svg></span><span>로그인 유지 <small>공용 기기에서는 선택하지 마세요.</small></span></label>
<div id="robot-check"></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>로그인</button>
</form>
<nav class="auth-links" aria-label="계정 도움말"><a href="/forgot.html">비밀번호 찾기</a><a href="/signup.html">회원가입</a></nav>
      </div>
    </main>
  </div>
  <script src="/js/site-theme.js" type="module"></script>
  <script src="/js/auth.js?v=20261109-layout" type="module"></script>
  <script src="/js/membership.js" type="module"></script>
</body>
</html>
