<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | YGMhelper</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body><header class="auth-topbar"><a href="/">YGMhelper</a></header><main class="auth-shell"><p class="beta-note">베타 서비스 · 정식 출시 시 계정과 데이터가 초기화됩니다.</p><p class="auth-eyebrow">YGMhelper 회원</p><h1>다시 만나서 반가워요</h1><p class="auth-intro">로그인하고 최신 시간표를 확인하세요.</p><form data-action="login" method="post" action="/api/auth/login"><label>아이디<input name="username" type="text" autocomplete="username" required pattern="[A-Za-z0-9_]{4,24}" minlength="4" maxlength="24"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required minlength="15" maxlength="128"></label><p class="field-note">비밀번호는 15자 이상입니다.</p><div id="robot-check"></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>로그인</button></form><p class="auth-bottom">아직 계정이 없나요? <a href="/signup.html">회원가입</a></p><p class="field-note">이메일을 수집하지 않아 아이디·비밀번호 찾기를 지원하지 않습니다.</p></main><script src="/js/auth.js" type="module"></script></body></html>
