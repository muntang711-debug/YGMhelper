<h1>인증 메일 다시 받기</h1><form id="resend-form" name="resend-form" novalidate data-action="resend" method="post" action="/api/auth/resend"><div class="auth-field"><input name="email" id="email" type="email" autocapitalize="none" spellcheck="false" autocomplete="email" maxlength="254" placeholder=" " required><label for="email">이메일</label><fieldset aria-hidden="true"><legend><span>이메일</span></legend></fieldset></div><div id="robot-check"></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>메일 보내기</button></form><p class="auth-bottom"><a href="/login.html">로그인</a></p>
