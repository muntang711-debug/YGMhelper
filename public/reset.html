<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link rel="stylesheet" href="/css/style.css?v=20261109-layout">
  <link rel="stylesheet" href="/css/auth.css?v=20261110-hover">
</head>
<body class="auth-page">
  <div id="app">
    <p class="beta-banner">베타 서비스 · 정식 출시 시 베타 계정과 데이터가 초기화됩니다.</p>
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">YGMhelper</a>

      <div class="topbar-actions">
        <a id="member-link" class="member-link" href="/login.html" hidden>로그인</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
      </div>
    </header>
    <main class="page-shell auth-shell">
      <div class="auth-content">
<h1>비밀번호 재설정</h1><form id="reset-form" name="reset-form" novalidate data-action="reset" method="post" action="/api/auth/reset"><div class="auth-field has-password-toggle"><input name="password" id="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" placeholder=" " required><label for="password">새 비밀번호</label><fieldset aria-hidden="true"><legend><span>새 비밀번호</span></legend></fieldset><button class="password-toggle" type="button" aria-label="새 비밀번호 표시" aria-controls="password" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 5.6A11 11 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.1 3.7M6.2 6.2A19 19 0 0 0 2.5 12s3.5 6.5 9.5 6.5a12 12 0 0 0 4-.7M10 10a3 3 0 0 0 4 4"/></svg></button></div><p class="field-note">10자 이상 입력해 주세요.</p><div class="auth-field has-password-toggle"><input name="confirm" id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="64" placeholder=" " required><label for="confirm">새 비밀번호 확인</label><fieldset aria-hidden="true"><legend><span>새 비밀번호 확인</span></legend></fieldset><button class="password-toggle" type="button" aria-label="새 비밀번호 확인 표시" aria-controls="confirm" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 5.6A11 11 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.1 3.7M6.2 6.2A19 19 0 0 0 2.5 12s3.5 6.5 9.5 6.5a12 12 0 0 0 4-.7M10 10a3 3 0 0 0 4 4"/></svg></button></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>비밀번호 변경</button></form><p class="auth-bottom"><a href="/login.html">로그인</a></p>
      </div>
    </main>
  </div>
  <script src="/js/site-theme.js" type="module"></script>
  <script src="/js/auth.js?v=20261109-layout" type="module"></script>
  <script src="/js/membership.js" type="module"></script>
</body>
</html>
