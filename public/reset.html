<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>비밀번호 재설정 | YGMhelper</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div id="app">
    <p class="beta-banner">베타 서비스 · 정식 출시 시 베타 계정과 데이터가 초기화됩니다.</p>
    <header class="topbar">
      <a class="brand" href="/" aria-label="YGMhelper 홈">YGMhelper</a>

      <div class="topbar-actions">
        <a id="member-link" class="member-link" href="/login.html" hidden>로그인</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="테마 변경" title="테마 변경">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.6 15.2A8.5 8.5 0 0 1 8.8 3.4 8.5 8.5 0 1 0 20.6 15.2Z"></path>
        </svg>
      </button>
      </div>
    </header>
    <main class="page-shell auth-shell">
      <div class="auth-content">
<h1>비밀번호 재설정</h1><form novalidate data-action="reset" method="post" action="/api/auth/reset"><label class="auth-field"><input name="password" id="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" placeholder=" " required><span>새 비밀번호</span></label><p class="field-note">10자 이상 입력해 주세요.</p><label class="auth-field"><input name="confirm" id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="64" placeholder=" " required><span>새 비밀번호 확인</span></label><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>비밀번호 변경</button></form><p class="auth-bottom"><a href="/login.html">로그인</a><a href="/resend.html">인증 메일 다시 받기</a></p>
      </div>
    </header>
    <main class="page-shell auth-shell">
      <div class="auth-content">
<h1>로그인</h1>
<form novalidate data-action="login" method="post" action="/api/auth/login">
<label class="auth-field"><input name="username" id="username" type="text" autocomplete="username" pattern="[A-Za-z0-9_]{4,24}" minlength="4" maxlength="24" placeholder=" " required><span>아이디</span></label>
<label class="auth-field"><input name="password" id="password" type="password" autocomplete="current-password" minlength="1" maxlength="128" placeholder=" " required><span>비밀번호</span></label>
<div id="robot-check"></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>로그인</button>
</form>
<p class="auth-bottom"><a href="/forgot.html">비밀번호 찾기</a><a href="/resend.html">인증 메일 다시 받기</a></p>
<p class="auth-bottom">계정이 없나요? <a href="/signup.html">회원가입</a></p>
      </div>
    </main>
  </div>
  <script src="/js/site-theme.js" type="module"></script>
  <script src="/js/auth.js" type="module"></script>
  <script src="/js/membership.js" type="module"></script>
</body>
</html>
