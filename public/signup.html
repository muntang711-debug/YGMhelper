<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | YGMhelper</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body><header class="auth-topbar"><a href="/">YGMhelper</a></header><main class="auth-shell"><p class="beta-note">베타 서비스 · 정식 출시 시 계정과 데이터가 초기화됩니다.</p><p class="auth-eyebrow">YGMhelper 회원</p><h1>내 시간표를 더 빠르게</h1><p class="auth-intro">계정을 만들고 컴시간의 최신 시간표를 확인하세요.</p><form data-action="signup" method="post" action="/api/auth/signup"><label>아이디<input name="username" type="text" autocomplete="username" required pattern="[A-Za-z0-9_]{4,24}" minlength="4" maxlength="24"></label><p class="field-note">영문 소문자, 숫자, 밑줄 4~24자</p><label>비밀번호<input name="password" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><p class="field-note">15~128자. 다른 사이트에서 쓰는 비밀번호는 사용하지 마세요.</p><label>비밀번호 확인<input name="confirm" type="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><div class="auth-consents"><label class="check-label"><input type="checkbox" name="betaReset" required>베타 계정과 데이터가 정식 출시 시 초기화되는 것에 동의합니다. (필수)</label><label class="check-label"><input type="checkbox" name="age14" required>만 14세 이상입니다. (필수)</label><label class="check-label"><input type="checkbox" name="privacy" required><span><a href="/privacy.html" target="_blank" rel="noopener">개인정보 수집·이용 안내</a>에 동의합니다. (필수)</span></label></div><div id="robot-check"></div><p id="form-status" role="status"></p><button class="auth-submit" type="submit" disabled>회원가입</button></form><p class="auth-bottom">이미 계정이 있나요? <a href="/login.html">로그인</a></p><p class="field-note">이메일·실명·생년월일은 받지 않습니다. 비밀번호를 분실하면 현재는 복구할 수 없습니다.</p></main><script src="/js/auth.js" type="module"></script></body></html>
