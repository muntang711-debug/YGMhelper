<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>YGM헬퍼 Tools</title>
    <link
        rel="stylesheet"
        href="../style.css"
    >
</head>

<body>

    <!-- 상단 헤더 -->
    <header class="header">

        <div class="header-inner">

            <h1 class="logo">
                YGM헬퍼
            </h1>

            <nav class="nav">

                <a href="/">
                    홈으로 돌아가기
                </a>

            </nav>

        </div>

    </header>


    <!-- 메인 영역 -->
    <main>

        <section class="today-section">

            <div class="section-title">

                <h2>
                    YGM헬퍼 Tools
                </h2>

            </div>


            <div class="info-container">

                <!-- 부가기능 안내 카드 -->
                <article class="info-card">

                    <div class="card-header">

                        <div>

                            <span class="card-icon">
                                🛠️
                            </span>

                            <h3>
                                YGM헬퍼 Tools
                            </h3>

                        </div>

                    </div>


                    <div class="meal-content">

                        <p>
                            YGM헬퍼에서 사용할 수 있는
                            다양한 부가기능을 이곳에서 제공합니다.
                        </p>

                    </div>

                </article>


                <!-- 타이머 -->
                <article class="info-card">

                    <div class="card-header">

                        <div>

                            <span class="card-icon">
                                ⏱️
                            </span>

                            <h3>
                                타이머
                            </h3>

                        </div>

                    </div>


                    <div class="meal-content">

                        <p>
                            분과 초를 간단하게 설정하고
                            사용할 수 있는 타이머입니다.
                        </p>

                        <div class="meal-actions">

                            <button
                                type="button"
                                class="meal-action-btn"
                                onclick="location.href='/timer'"
                            >
                                ⏱️ 타이머 열기
                            </button>

                        </div>

                    </div>

                </article>

            </div>

        </section>

    </main>


    <script src="../script.js"></script>

</body>

</html>
